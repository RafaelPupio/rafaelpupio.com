name: Daily repo sync

on:
  schedule:
    - cron: '0 11 * * *'   # 07:00 America/Cuiaba
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate Shipping Log
        run: node scripts/sync-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "shipping-log-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: daily shipping log sync"
            git push
          else
            echo "No changes today."
          fi
